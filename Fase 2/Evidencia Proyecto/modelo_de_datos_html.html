<title>Modelo de datos CONVI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app de pantalla completa. Barra con búsqueda y filtros; lienzo ER con arrastre y zoom; módulos en cuadrícula 3x3 */
:root{
  --bg:#f2f4f6; --canvas:#eceff3; --card:#ffffff; --head:#f7f8fa; --line:#d3d9e0; --line-2:#e6e9ee;
  --fg:#17202a; --muted:#5d6876; --accent:#1d5bb8; --accent-soft:#e3ecf9; --dot:#d6dce4;
  --m1:#3b5b86; --m2:#23847a; --m3:#bf5f22; --m4:#b0344a; --m5:#6c4b98; --m6:#a87a07; --m7:#4b7b2e; --m8:#7b6650; --m9:#3f6f92;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --shadow:0 1px 2px rgba(23,32,42,.06),0 4px 14px rgba(23,32,42,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --canvas:#0d1217; --card:#18202a; --head:#1d2631; --line:#2c3846; --line-2:#232d38;
  --fg:#e6ebf1; --muted:#97a3b1; --accent:#7eaaf0; --accent-soft:#1d2c44; --dot:#1f2832;
  --m1:#86a6d6; --m2:#5cc3b6; --m3:#ec9a63; --m4:#ec7f92; --m5:#ad91dc; --m6:#dcb44a; --m7:#93c46f; --m8:#c3ab90; --m9:#7eb2d8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --canvas:#0d1217; --card:#18202a; --head:#1d2631; --line:#2c3846; --line-2:#232d38;
  --fg:#e6ebf1; --muted:#97a3b1; --accent:#7eaaf0; --accent-soft:#1d2c44; --dot:#1f2832;
  --m1:#86a6d6; --m2:#5cc3b6; --m3:#ec9a63; --m4:#ec7f92; --m5:#ad91dc; --m6:#dcb44a; --m7:#93c46f; --m8:#c3ab90; --m9:#7eb2d8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 24px;padding:14px 20px 12px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;margin:2px 0 0;letter-spacing:-.01em}
.stats{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line)}
.toolbar input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);width:220px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px;min-width:32px}
.btn:hover{border-color:var(--accent)}
.zoomgrp{display:inline-flex;gap:4px;margin-left:auto;align-items:center}
.zoomgrp output{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px;touch-action:none;cursor:grab}
.stage.dragging{cursor:grabbing}
#svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.keybox{position:absolute;right:12px;bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px}
.keybox svg{vertical-align:middle;margin-right:6px;color:var(--fg)}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:11.5px;padding:4px 8px;border-radius:5px;white-space:nowrap;z-index:3}
@media (max-width:760px){.keybox{display:none}}

/* SVG */
.mod-rect{stroke-width:1.2}
.mod-title{font-family:var(--display);font-weight:700;font-size:20px}
.mod-sub{font-family:var(--sans);font-size:13px;fill:var(--muted)}
.card{cursor:pointer;transition:opacity .15s}
.card .bg{fill:var(--card);stroke:var(--line)}
.card .hbg{fill:var(--head)}
.card:hover .bg{stroke:var(--accent)}
.card.sel .bg{stroke:var(--accent);stroke-width:2.5}
.card.match .bg{stroke:var(--accent);stroke-width:3}
.tname{font-family:var(--sans);font-weight:600;font-size:14px;fill:var(--fg)}
.tcount{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.cname{font-family:var(--mono);font-size:11.5px;fill:var(--fg)}
.ctype{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.kpk{font-family:var(--mono);font-size:9.5px;font-weight:600;fill:var(--m6)}
.kfk{font-family:var(--mono);font-size:9.5px;font-weight:600;fill:var(--accent)}
.more{font-family:var(--sans);font-size:11px;fill:var(--muted);font-style:italic}
.rowhot{fill:var(--accent-soft)}
.sep{stroke:var(--line-2)}
.edge{fill:none;stroke-width:1.4;opacity:.5;transition:opacity .15s}
.edge.x{opacity:.28}
.edge.weak{stroke:var(--muted)!important;stroke-dasharray:4 4;opacity:.3;stroke-width:1}
.mark{fill:none;stroke-width:1.4;opacity:.65}
.mark.o{fill:var(--canvas)}
svg.focus .card:not(.rel){opacity:.15}
svg.focus .eg:not(.hot){opacity:.05}
svg.focus .eg.hot .edge{opacity:1;stroke-width:2.4}
svg.focus .eg.hot .mark{opacity:1;stroke-width:2}
svg.searching .card:not(.match){opacity:.25}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div>
      <h1>Modelo de datos CONVI</h1>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="toolbar">
    <input id="q" type="search" placeholder="Buscar tabla o columna" aria-label="Buscar tabla o columna">
    <div class="seg" id="colmode" role="group" aria-label="Columnas visibles">
      <button data-v="keys" class="on">Claves y estados</button>
      <button data-v="all">Todas las columnas</button>
    </div>
    <div class="zoomgrp">
      <output id="zl">100%</output>
      <button class="btn" id="zout" aria-label="Alejar">−</button>
      <button class="btn" id="zin" aria-label="Acercar">+</button>
      <button class="btn" id="fit">Ver todo</button>
    </div>
  </div>
  <div class="stage" id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="vp"><g id="gmods"></g><g id="gedges"></g><g id="gcards"></g></g></svg>
    <div class="keybox">
      <div><svg width="52" height="14"><path d="M2 7 H50 M2 1 L12 7 L2 13 M44 1 V13" stroke="currentColor" fill="none"/></svg>muchos (FK obligatoria) a uno (PK)</div>
      <div><svg width="52" height="14"><path d="M2 7 H50 M2 1 L12 7 L2 13 M44 1 V13" stroke="currentColor" fill="none"/><circle cx="18" cy="7" r="3.5" fill="var(--card)" stroke="currentColor"/></svg>muchos (FK opcional) a uno</div>
      <div><svg width="52" height="14"><path d="M2 7 H50 M8 1 V13 M44 1 V13" stroke="currentColor" fill="none"/></svg>uno (FK única) a uno</div>
      <div><svg width="52" height="14"><path d="M2 7 H50" stroke="currentColor" stroke-dasharray="4 4" fill="none"/></svg>autoría o establecimiento</div>
    </div>
    <div class="tip" id="tip" hidden></div>
  </div>
</div>

 {id:3,name:'Reporte y revisión',sub:'Del hecho reportado a la decisión',cols:[['categorias_convivencia','situaciones','aclaraciones_situacion'],['participaciones','revisiones_convivencia','referencias_revision_normativa']]},
 {id:4,name:'Gestión de casos',sub:'Expediente, intervención y seguimiento',cols:[['casos','historial_estados_caso','comunicaciones'],['planes_intervencion','acciones_plan_intervencion','actuaciones'],['compromisos','revisiones_compromisos']]},
 {id:5,name:'Protocolos y normativa',sub:'Reglamento, protocolos y su aplicación',cols:[['protocolos_caso','estados_pasos_protocolo_caso'],['protocolos','versiones_protocolo','pasos_protocolo'],['documentos_institucionales','versiones_documento','fragmentos_rag']]},
 {id:6,name:'Alertas y avisos',sub:'Reglas que vigilan plazos y patrones',cols:[['reglas','alertas'],['situaciones_alerta','notificaciones']]},
 {id:8,name:'Evidencias, archivos e informes',sub:'Respaldo documental y salidas',cols:[['evidencias'],['archivos','informes','borradores_documentales_ia']]},
 {id:9,name:'Importación, auditoría e IA',sub:'Carga masiva y trazabilidad',cols:[['procesos_importacion','filas_importacion'],['registros_solicitudes_ia','eventos_auditoria']]},
];
const GRID=[[1,2,7],[3,4,5],[6,8,9]];
const ACTOR=/(_por|^membresia_actor_id)$/;   // columnas que solo registran quién hizo algo
const modOf={};MODS.forEach(m=>m.cols.flat().forEach(t=>modOf[t]=m));
const mvar=t=>`var(--m${modOf[t].id})`;
const KEYCOL=/^(estado|estado_actual|codigo|codigo_perfil|nombre|titulo|tipo_\w+|anio|codigo_regla|numero_version|rut|urgencia|estado_entrega|estado_procesamiento)$/;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Relaciones
const REL=[];
Object.keys(S).forEach(t=>(S[t].fks||[]).forEach(f=>{
  const c=S[t].cols.find(x=>x.n===f.c)||{};
  REL.push({from:t,col:f.c,to:f.r,nn:!!c.nn,one:UNO_A_UNO.has(t+'.'+f.c),weak:f.r==='membresias_establecimiento'&&ACTOR.test(f.c)});
}));
const TENANT=Object.keys(S).filter(t=>t!=='establecimientos'&&!S[t].ext).map(t=>({from:t,col:'establecimiento_id',to:'establecimientos',nn:true,weak:true,tenant:true}));
// FK de cada tabla, incluida establecimiento_id, que tienen todas salvo establecimientos
const fksOf=t=>(S[t].fks||[]).concat(t!=='establecimientos'&&!S[t].ext?[{c:'establecimiento_id',r:'establecimientos'}]:[]);
const real=Object.keys(S).filter(t=>!S[t].ext);
document.getElementById('stats').innerHTML=`<span><b>${real.length}</b> tablas</span><span><b>${real.reduce((a,t)=>a+S[t].cols.length,0)}</b> columnas</span><span><b>${REL.length+TENANT.length}</b> claves foráneas</span><span><b>${MODS.length}</b> módulos</span>`;

let mode='keys',focusT=null;
const CW=300,HD=36,RH=20,CGX=70,CGY=30,MPX=28,MPT=74,MPB=26,GX=170,GY=150;
const NS='http://www.w3.org/2000/svg';
let L={}; // layout

function visCols(t){
  const fk=new Set(fksOf(t).map(f=>f.c));
  return S[t].cols.filter(c=>mode==='all'||c.pk||fk.has(c.n)||KEYCOL.test(c.n));
}
function layout(){
  L={cards:{},mods:{}};
  // tamaño de cada módulo
  const msize={};
  MODS.forEach(m=>{
    let w=0,h=0;const colH=m.cols.map(col=>col.reduce((a,t)=>a+cardH(t)+CGY,-CGY));
    w=m.cols.length*CW+(m.cols.length-1)*CGX+2*MPX;h=Math.max(...colH)+MPT+MPB;msize[m.id]={w,h};
  });
  const colW=[0,1,2].map(c=>Math.max(...GRID.map(r=>msize[r[c]].w)));
  const rowH=GRID.map(r=>Math.max(...r.map(id=>msize[id].h)));
  let y=0;
  GRID.forEach((r,ri)=>{let x=0;r.forEach((id,ci)=>{
    const m=MODS.find(q=>q.id===id),sz=msize[id];
    const mx=x+(colW[ci]-sz.w)/2;
    L.mods[id]={x:mx,y,w:sz.w,h:rowH[ri]};
    m.cols.forEach((col,k)=>{let cy=y+MPT;col.forEach(t=>{const h=cardH(t);L.cards[t]={x:mx+MPX+k*(CW+CGX),y:cy,w:CW,h};cy+=h+CGY})});
    x+=colW[ci]+GX});y+=rowH[ri]+GY});
  L.W=colW.reduce((a,b)=>a+b)+2*GX;L.H=y;
}
function cardH(t){const n=visCols(t).length,hidden=S[t].cols.length-n;return n||hidden?HD+n*RH+(hidden>0?RH:0)+6:HD}

function fitText(s,maxCh){return s.length>maxCh?s.slice(0,maxCh-1)+'…':s}

function draw(){
  layout();
  const gm=document.getElementById('gmods'),gc=document.getElementById('gcards'),ge=document.getElementById('gedges');
  let h='';
  MODS.forEach(m=>{const r=L.mods[m.id];const c=`var(--m${m.id})`;
    h+=`<g><rect class="mod-rect" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="14" fill="${c}" fill-opacity=".07" stroke="${c}" stroke-opacity=".45"/>
    <text class="mod-title" x="${r.x+MPX}" y="${r.y+34}" fill="${c}">${esc(m.name)}</text><text class="mod-sub" x="${r.x+MPX}" y="${r.y+54}">${esc(m.sub)}</text></g>`});
  gm.innerHTML=h;
  // tarjetas
  h='';
  Object.keys(L.cards).forEach(t=>{
    const b=L.cards[t],fk=Object.fromEntries(fksOf(t).map(f=>[f.c,f.r])),vc=visCols(t),c=mvar(t);
    let s=`<g class="card" data-t="${t}" tabindex="0" role="button" aria-label="Tabla ${esc(nom(t))}" transform="translate(${b.x},${b.y})">
      <rect class="bg" width="${b.w}" height="${b.h}" rx="8" ${S[t].ext?'stroke-dasharray="5 4"':''}/>
      <path class="hbg" d="M0.5 8 a7.5 7.5 0 0 1 7.5 -7.5 H${b.w-8} a7.5 7.5 0 0 1 7.5 7.5 V${HD} H0.5 Z"/>
      <rect x="0" y="0" width="${b.w}" height="4" rx="2" fill="${c}"/>
      <line class="sep" x1="0" x2="${b.w}" y1="${HD}" y2="${HD}"/>
      <text class="tname" x="12" y="24">${esc(fitText(nom(t),30))}</text><text class="tcount" x="${b.w-12}" y="24" text-anchor="end">${S[t].ext?'':S[t].cols.length+' col'}</text>`;
    vc.forEach((col,i)=>{const y=HD+i*RH;const isfk=fk[col.n];
      s+=`<g class="row" data-c="${col.n}">${isfk?`<rect class="rowbg" x="1" y="${y+1}" width="${b.w-2}" height="${RH-1}" fill="transparent"/>`:''}
      ${col.pk&&isfk?`<text x="9" y="${y+14}"><tspan class="kpk">PK</tspan><tspan class="kfk">FK</tspan></text>`:`<text class="${col.pk?'kpk':isfk?'kfk':'ctype'}" x="12" y="${y+14}">${col.pk?'PK':isfk?'FK':''}</text>`}
      <text class="cname" x="36" y="${y+14}">${esc(fitText(col.n,isfk||col.pk?28:26))}</text>
      ${isfk?'':`<text class="ctype" x="${b.w-12}" y="${y+14}" text-anchor="end">${esc(col.t)}</text>`}</g>`});
    const hidden=S[t].cols.length-vc.length;
    if(hidden>0)s+=`<text class="more" x="36" y="${HD+vc.length*RH+14}">+ ${hidden} columnas más</text>`;
    s+='</g>';h+=s});
  gc.innerHTML=h;
  drawEdges();
  applyFocus();
}

function rowY(t,c){const b=L.cards[t];const i=visCols(t).findIndex(x=>x.n===c);return i<0?b.y+HD/2:b.y+HD+i*RH+RH/2}
function drawEdges(){
  const list=REL.concat(TENANT);
  // repartir los puntos de llegada en cada lado de la tabla destino
  const ports={};
  list.forEach(r=>{const a=L.cards[r.from],b=L.cards[r.to];
    const ax=a.x+a.w/2,bx=b.x+b.w/2;
    let side;if(r.from===r.to||Math.abs(ax-bx)<a.w*.6)side='R';else side=ax<bx?'L':'R';
    r.side=side;r.sy=rowY(r.from,r.col);(ports[r.to+side]=ports[r.to+side]||[]).push(r)});
  Object.entries(ports).forEach(([k,arr])=>{arr.sort((p,q)=>p.sy-q.sy);const t=arr[0].to,b=L.cards[t];
    const top=b.y+10,bot=b.y+Math.min(b.h-10,HD+RH*1.5+arr.length*6);
    arr.forEach((r,i)=>r.ty=arr.length===1?Math.min(b.y+HD+RH/2,b.y+b.h/2+2):top+(bot-top)*i/(arr.length-1))});
  let h='';
  list.forEach((r,idx)=>{
    const a=L.cards[r.from],b=L.cards[r.to],c=r.weak?'var(--muted)':mvar(r.from);
    let sx,tx,d,dirS,dirT;
    if(r.side==='R'&&(r.from===r.to||Math.abs((a.x+a.w/2)-(b.x+b.w/2))<a.w*.6)){
      sx=a.x+a.w;tx=b.x+b.w;dirS=1;dirT=1;const k=40+Math.abs(r.sy-r.ty)*.15;
      d=`M${sx},${r.sy} C${sx+k},${r.sy} ${tx+k},${r.ty} ${tx},${r.ty}`}
    else{
      const right=a.x+a.w/2<b.x+b.w/2;sx=right?a.x+a.w:a.x;tx=right?b.x:b.x+b.w;dirS=right?1:-1;dirT=-dirS;
      const k=Math.max(50,Math.abs(tx-sx)*.45);
      d=`M${sx},${r.sy} C${sx+dirS*k},${r.sy} ${tx+dirT*k},${r.ty} ${tx},${r.ty}`}
    // marcas: pata de gallo en el lado FK (muchos) o barra si la FK es única (uno), barra en el lado PK (uno)
    const fx=sx+dirS*12;
    let mk=r.one?`<path class="mark" stroke="${c}" d="M${sx+dirS*8},${r.sy-6} V${r.sy+6}"/>`:`<path class="mark" stroke="${c}" d="M${sx},${r.sy-6} L${fx},${r.sy} L${sx},${r.sy+6}"/>`;
    if(!r.nn)mk+=`<circle class="mark o" stroke="${c}" cx="${sx+dirS*18}" cy="${r.sy}" r="3.5"/>`;
    mk+=`<path class="mark" stroke="${c}" d="M${tx+dirT*8},${r.ty-6} V${r.ty+6}"/>`;
    h+=`<g class="eg" data-a="${r.from}" data-b="${r.to}" data-c="${r.col}"><path class="edge${r.weak?' weak':''}${modOf[r.from]!==modOf[r.to]?' x':''}" stroke="${c}" d="${d}"/>${mk}</g>`});
  document.getElementById('gedges').innerHTML=h;
}

// Enfoque
const svg=document.getElementById('svg');
function applyFocus(){
  svg.classList.toggle('focus',!!focusT);
  document.querySelectorAll('.card').forEach(c=>{c.classList.remove('rel','sel');c.querySelectorAll('.rowbg').forEach(r=>r.classList.remove('rowhot'))});
  document.querySelectorAll('.eg').forEach(e=>e.classList.remove('hot'));
  if(!focusT)return;
  const rel=new Set([focusT]);
  document.querySelectorAll('.eg').forEach(e=>{if(e.dataset.a===focusT||e.dataset.b===focusT){e.classList.add('hot');rel.add(e.dataset.a);rel.add(e.dataset.b);
    const rb=document.querySelector(`.card[data-t="${CSS.escape(e.dataset.a)}"] .row[data-c="${CSS.escape(e.dataset.c)}"] .rowbg`);if(rb)rb.classList.add('rowhot')}});
  document.querySelectorAll('.card').forEach(c=>{if(rel.has(c.dataset.t))c.classList.add('rel');if(c.dataset.t===focusT)c.classList.add('sel')});
}

// Pan y zoom
const vp=document.getElementById('vp'),stage=document.getElementById('stage');
let V={x:0,y:0,k:1};
function setV(){vp.setAttribute('transform',`translate(${V.x},${V.y}) scale(${V.k})`);document.getElementById('zl').value=Math.round(V.k*100)+'%'}
function zoomAt(f,cx,cy){const k=Math.min(2.5,Math.max(.08,V.k*f));V.x=cx-(cx-V.x)*k/V.k;V.y=cy-(cy-V.y)*k/V.k;V.k=k;setV()}
function fitBox(x,y,w,h,pad=30){const r=stage.getBoundingClientRect();const k=Math.min((r.width-2*pad)/w,(r.height-2*pad)/h,1.4);V.k=k;V.x=(r.width-w*k)/2-x*k;V.y=(r.height-h*k)/2-y*k;setV()}
function fitAll(){fitBox(0,0,L.W,L.H-GY,24)}
stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),e.clientX-r.left,e.clientY-r.top)},{passive:false});
const pts=new Map();let moved=false,pinch0=null,downT=null;
stage.addEventListener('pointerdown',e=>{if(e.target.closest('.keybox'))return;downT=e.target;stage.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
  if(pts.size===2){const [p,q]=[...pts.values()];pinch0={d:Math.hypot(p.x-q.x,p.y-q.y),k:V.k}}});
stage.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId)){hoverTip(e);return}
  const prev=pts.get(e.pointerId),dx=e.clientX-prev.x,dy=e.clientY-prev.y;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&pinch0){const [p,q]=[...pts.values()];const r=stage.getBoundingClientRect();const d=Math.hypot(p.x-q.x,p.y-q.y);zoomAt(pinch0.k*d/pinch0.d/V.k,(p.x+q.x)/2-r.left,(p.y+q.y)/2-r.top);moved=true;return}
  if(Math.abs(dx)+Math.abs(dy)>0){if(!moved&&Math.hypot(dx,dy)<2)return;moved=true;stage.classList.add('dragging');V.x+=dx;V.y+=dy;setV()}});
const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch0=null;stage.classList.remove('dragging');
  if(!moved&&e.type==='pointerup'){const c=downT&&downT.closest&&downT.closest('.card');focusT=c?(focusT===c.dataset.t?null:c.dataset.t):null;applyFocus()}};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
document.getElementById('gcards').addEventListener('keydown',e=>{const c=e.target.closest('.card');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();focusT=focusT===c.dataset.t?null:c.dataset.t;applyFocus()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){focusT=null;applyFocus()}});

// Tooltip sobre filas FK
const tip=document.getElementById('tip');
function hoverTip(e){const row=e.target.closest&&e.target.closest('.row');const card=row&&row.closest('.card');
  if(!row||!card){tip.hidden=true;return}
  const t=card.dataset.t,c=row.dataset.c,f=fksOf(t).find(x=>x.c===c);const col=S[t].cols.find(x=>x.n===c);
  const r=stage.getBoundingClientRect();
  tip.textContent=f?`${nom(t)}.${c} → ${nom(f.r)}.id${col&&!col.nn?' (opcional)':''}${UNO_A_UNO.has(t+'.'+c)?' (uno a uno)':''}`:`${c}: ${col.t}${col.nn?' not null':''}`;
  tip.hidden=false;tip.style.left=Math.min(e.clientX-r.left+14,r.width-tip.offsetWidth-8)+'px';tip.style.top=(e.clientY-r.top+14)+'px'}
stage.addEventListener('pointerleave',()=>tip.hidden=true);

// Controles
document.getElementById('zin').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(1.25,r.width/2,r.height/2)};
document.getElementById('zout').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(.8,r.width/2,r.height/2)};
document.getElementById('fit').onclick=fitAll;
document.querySelectorAll('#colmode button').forEach(b=>b.onclick=()=>{mode=b.dataset.v;document.querySelectorAll('#colmode button').forEach(x=>x.classList.toggle('on',x===b));draw();runSearch()});
const q=document.getElementById('q');
function runSearch(){const s=q.value.trim().toLowerCase();svg.classList.toggle('searching',!!s);const hits=[];
  document.querySelectorAll('.card').forEach(c=>{const t=c.dataset.t;const m=!!s&&(t.includes(s)||nom(t).includes(s)||S[t].cols.some(x=>x.n.includes(s)));c.classList.toggle('match',m);if(m)hits.push(t)});return hits}
q.addEventListener('input',runSearch);
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const h=runSearch();if(h.length){const b=L.cards[h[0]];fitBox(b.x-40,b.y-40,b.w+80,b.h+80,40)}}});

draw();
requestAnimationFrame(fitAll);
</script>

</body></html>
